[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "live: tests that hit live external APIs (require network)",
]

[project]
name = "money"
version = "0.1.0"
description = "Going to build a portfolio GUI based upon SchwabAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "isort>=8.0.1",
    "matplotlib>=3.8.0",
    "nicegui>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyfredapi>=0.10.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.48",
    "yfinance>=0.2.0",
]
